<meta charset="utf-8">
<title>심연의 대장간</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Song+Myung&family=Nanum+Myeongjo:wght@700;800&family=Gothic+A1:wght@400;600;800&family=Nanum+Gothic+Coding:wght@700&display=swap">
<style>
/* 레이아웃: 한 손 세로 화면. 위 상태줄 · 가운데 모루(무기) · 핏빛 강화 버튼 · 아래 탭. 리니지·디아블로풍: 그을린 철판, 낡은 금테, 양피지색 글씨. */
:root {
  --bg: #0c0a09;
  --panel: #17130f;
  --panel-2: #231c15;
  --line: #3b3024;
  --fg: #eadfc8;
  --muted: #9d907b;
  --ember: #9e1f17;
  --ember-hi: #d8442c;
  --mineral: #6fd6c4;
  --gold: #c9a24a;
  --gold-hi: #f1d488;
  --ok: #7cc98a;
  --no: #e4675a;
  --font-display: "Song Myung", "Nanum Myeongjo", "AppleMyungjo", serif;
  --font-head: "Nanum Myeongjo", "AppleMyungjo", "Batang", serif;
  --font-body: "Gothic A1", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-num: "Nanum Gothic Coding", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 4px;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { background: var(--bg); color: var(--fg); }
body {
  font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(88px + env(safe-area-inset-bottom, 0px));
  background-image: radial-gradient(ellipse at 50% -10%, #2a1a12 0%, transparent 55%), radial-gradient(ellipse at 50% 120%, #1a0d0b 0%, transparent 60%);
  background-attachment: fixed;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
#view { display: flex; flex-direction: column; gap: 12px; padding-top: 12px; }
.wrap { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
canvas.spr { display: block; max-width: 100%; height: auto; }
button { font: inherit; color: inherit; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--mineral); outline-offset: 2px; }
small { color: var(--muted); font-weight: 400; }
.note { color: var(--muted); font-size: 13px; margin: 0; }
.warn { margin: 0; font-size: 13px; color: var(--gold); background: #2a2410; border: 1px solid #5a4a18; border-radius: var(--r); padding: 8px 10px; }

/* 상태줄 */
#hud { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 12px 8px; border-bottom: 1px solid var(--line); display: grid; gap: 4px; }
.hud-main { display: flex; align-items: baseline; gap: 6px; }
.mineral { font-family: var(--font-num); font-size: 28px; color: var(--mineral); font-variant-numeric: tabular-nums; letter-spacing: -0.5px; }
.unit { color: var(--muted); font-size: 13px; }
.speed { margin-left: auto; align-self: center; background: var(--panel-2); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-family: var(--font-num); font-size: 13px; color: var(--muted); cursor: pointer; }
.speed.s2 { color: var(--mineral); border-color: var(--mineral); }
.speed.s3 { color: var(--gold); border-color: var(--gold); box-shadow: 0 0 12px -2px var(--gold); }
.hud-sub { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12.5px; color: var(--muted); }
.hud-sub b { color: var(--fg); font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.hint { text-align: left; background: #2a2410; border: 1px solid var(--gold); color: var(--gold); border-radius: var(--r); padding: 6px 10px; font-size: 13px; cursor: pointer; }

/* 모루 */
.anvil, .mine, .boss { display: grid; grid-template-columns: 132px 1fr; gap: 14px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; position: relative; }
.mine, .boss { grid-template-columns: 120px 1fr; }
.anvil > div, .mine > div, .boss > div { min-width: 0; }
.anvil.empty { display: block; text-align: center; color: var(--muted); padding-block: 40px; }
.anvil-art { background: radial-gradient(circle at 50% 55%, var(--panel-2), transparent 70%); border-radius: var(--r); }
.aura-blue .anvil-art, .tile.aura-blue { box-shadow: 0 0 0 1px #3d8ee8, 0 0 18px -4px #3d8ee8; }
.aura-violet .anvil-art, .tile.aura-violet { box-shadow: 0 0 0 1px #9a55e8, 0 0 22px -2px #9a55e8; }
.aura-gold .anvil-art, .tile.aura-gold { box-shadow: 0 0 0 1px var(--gold), 0 0 28px 0 var(--gold); }
.anvil.flash { animation: flash 0.35s ease-out; }
.anvil.dim { animation: dim 0.35s ease-out; }
@keyframes flash { from { background: #3a3014; } to { background: var(--panel); } }
@keyframes dim { from { background: #2a1416; } to { background: var(--panel); } }
.grade-tag { margin: 0; font-size: 12px; letter-spacing: 0.08em; color: var(--grade, var(--muted)); font-weight: 800; }
h2 { margin: 2px 0 6px; font-family: var(--font-display); font-weight: 400; font-size: 22px; line-height: 1.2; text-wrap: balance; }
h2 .lv { color: var(--ember-hi); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px 8px; margin: 0 0 6px; }
.stats div { min-width: 0; }
.stats dt { font-size: 11px; color: var(--muted); }
.stats dd { margin: 0; font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: 14px; overflow-wrap: anywhere; }
.fail-note { margin: 0 0 6px; font-size: 12px; color: var(--muted); }
.pity { position: relative; height: 14px; background: var(--panel-2); border-radius: 3px; overflow: hidden; }
.pity span { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, #6b4a12, var(--gold)); }
.pity em { position: relative; font-style: normal; font-size: 10.5px; padding-left: 6px; line-height: 14px; display: block; }
.traits { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0 0; }
.traits span { font-size: 11px; border: 1px solid var(--line); border-radius: 3px; padding: 0 5px; color: var(--gold); }

/* 버튼 */
.enhance-btn { width: 100%; border: 0; border-radius: var(--r); padding: 16px; display: grid; gap: 2px; cursor: pointer; background: linear-gradient(180deg, var(--ember-hi), var(--ember)); color: #1a0703; box-shadow: 0 4px 0 #8a1f10; transition: transform 0.05s; }
.enhance-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #8a1f10; }
.enhance-btn.mint { background: linear-gradient(180deg, #8ff3e3, var(--mineral)); color: #062320; box-shadow: 0 4px 0 #1d7d70; }
.enhance-btn:disabled { background: var(--panel-2); color: var(--muted); box-shadow: none; cursor: not-allowed; }
.eb-title { font-family: var(--font-display); font-size: 30px; line-height: 1.1; letter-spacing: 0.04em; }
.eb-meta { font-family: var(--font-num); font-size: 13px; font-variant-numeric: tabular-nums; }
.row { display: flex; flex-wrap: wrap; gap: 8px; }
.row .btn { flex: 1 1 30%; }
.btn { background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 8px; cursor: pointer; font-size: 13.5px; font-weight: 600; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.big { width: 100%; padding: 14px; font-size: 15px; }
.btn.gold { background: #3a2e0c; border-color: var(--gold); color: var(--gold); }
.btn.mint { background: #0e2a27; border-color: var(--mineral); color: var(--mineral); }
.btn.on { border-color: var(--ember-hi); color: var(--ember-hi); }

h3.sec { margin: 8px 0 0; font-size: 14px; font-weight: 800; display: flex; gap: 8px; align-items: baseline; }
.shop { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.buy { display: grid; justify-items: center; gap: 2px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 8px 4px; cursor: pointer; font-size: 13px; }
.buy small { font-family: var(--font-num); color: var(--mineral); }
.buy:disabled { opacity: 0.45; cursor: not-allowed; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 8px; }
.tile { position: relative; display: grid; justify-items: center; background: var(--panel); border: 1px solid var(--grade); border-radius: var(--r); padding: 6px 2px 4px; cursor: pointer; }
.tile.on { outline: 2px solid var(--ember-hi); outline-offset: 1px; }
.tile-lv { font-family: var(--font-num); font-size: 13px; }
.tile-loc { font-size: 10px; border-radius: 3px; padding: 0 4px; }
.tile-loc.loc-mine { background: #0e2a27; color: var(--mineral); }
.tile-loc.loc-battle { background: #2e1410; color: var(--ember-hi); }
.tile-dot { position: absolute; top: 4px; right: 4px; width: 8px; height: 8px; border-radius: 50%; background: var(--gold); }
.auto { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; font-size: 13px; }
select { background: var(--panel-2); color: var(--fg); border: 1px solid var(--line); border-radius: 4px; padding: 4px; font: inherit; }

/* 채집장·보스 */
.hp, .fightbar { height: 10px; background: var(--panel-2); border-radius: 3px; overflow: hidden; margin: 6px 0; position: relative; }
.hp span { display: block; height: 100%; background: var(--mineral); transition: width 0.9s linear; }
.fightbar { height: 26px; }
.fightbar span { display: block; height: 100%; background: linear-gradient(90deg, #7a1f2b, var(--no)); transition: width 0.2s linear; }
.fightbar em { position: absolute; inset: 0; display: grid; place-items: center; font-style: normal; font-family: var(--font-num); font-size: 13px; }
.boss-art.hit { animation: hit 0.2s steps(2) infinite; }
@keyframes hit { 50% { transform: translateX(3px); filter: brightness(1.6); } }
.hints { margin: 0 0 4px; padding-left: 18px; font-size: 13px; color: var(--muted); }
table.ready { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); font-size: 13px; }
.ready th, .ready td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
.ready th { font-weight: 600; color: var(--muted); white-space: nowrap; }
.ready td { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.ready tr:last-child th, .ready tr:last-child td { border-bottom: 0; }
.ready .btn { padding: 6px 8px; width: 100%; }
.pill { font-family: var(--font-body); font-size: 11.5px; font-weight: 800; border-radius: 999px; padding: 1px 8px; }
.pill.ok { background: #12301f; color: var(--ok); }
.pill.no { background: #3a1414; color: var(--no); }
.rebirth { display: grid; gap: 8px; background: var(--panel); border: 1px dashed var(--gold); border-radius: var(--r); padding: 12px; }
.rebirth p { margin: 0; font-size: 13.5px; }
.rebirth b { color: var(--gold); }

/* 도감·상점 */
.book { display: grid; gap: 10px; }
.book-card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: grid; gap: 8px; }
.book-card.locked { opacity: 0.55; }
.book-card header { display: flex; gap: 10px; align-items: center; }
.book-card h4 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 18px; }
.gchips { display: flex; flex-wrap: wrap; gap: 4px; }
.gchip { font-size: 11px; border: 1px solid var(--line); border-radius: 3px; padding: 0 6px; color: var(--muted); }
.gchip.seen { border-color: var(--grade); color: var(--grade); }
.names { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 2px 10px; font-size: 13px; color: var(--muted); }
.names li span { font-family: var(--font-num); display: inline-block; min-width: 64px; font-size: 11.5px; color: var(--muted); }
.names li.seen { color: var(--fg); }
.unlock { display: grid; grid-template-columns: 40px 1fr auto; gap: 10px; align-items: center; background: var(--panel); border: 1px solid var(--gold); border-radius: var(--r); padding: 10px; }
.unlock div { display: grid; min-width: 0; }
.cash { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.cash li { display: flex; justify-content: space-between; align-items: center; gap: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 8px 10px; font-size: 13.5px; }
.cash .btn { flex: 0 0 auto; }

/* 탭 */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: #0d151b; border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(5, 1fr); padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
.tabs button { background: none; border: 0; padding: 8px 0; font-size: 13px; font-weight: 800; color: var(--muted); cursor: pointer; border-radius: var(--r); }
.tabs button[aria-current="page"] { color: var(--fg); background: var(--panel-2); box-shadow: inset 0 -2px 0 var(--ember); }

/* 팝업·알림 */
#modal { position: fixed; inset: 0; z-index: 20; background: rgba(4, 8, 10, 0.72); display: grid; align-items: end; padding: 0 max(12px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); }
.sheet { max-width: 480px; width: 100%; margin: 0 auto; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 10px; max-height: 80vh; overflow-y: auto; }
.sheet h3 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 22px; }
.sheet p { margin: 0; }
.choices { display: grid; gap: 8px; }
.seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.scroll { overflow-x: auto; }
.big-num { font-family: var(--font-num); font-size: 26px; color: var(--mineral); }
#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(80px + env(safe-area-inset-bottom, 0px)); z-index: 30; background: #1f2b34; border: 1px solid var(--line); border-radius: var(--r); padding: 8px 14px; font-size: 13.5px; max-width: min(440px, calc(100vw - 32px)); text-align: center; box-shadow: 0 6px 20px rgba(0,0,0,0.4); }
#banner { position: fixed; inset: 0; z-index: 25; display: grid; place-items: center; pointer-events: none; }
.banner-inner { display: grid; justify-items: center; gap: 2px; background: rgba(8, 10, 12, 0.88); border: 2px solid var(--grade); padding: 18px 28px; border-radius: 10px; box-shadow: 0 0 60px var(--grade); animation: pop 0.4s ease-out; max-width: calc(100vw - 32px); text-align: center; }
.banner-inner strong { font-family: var(--font-display); font-weight: 400; font-size: 64px; line-height: 1; color: var(--grade); }
.banner-inner span { font-family: var(--font-display); font-size: 22px; }
@keyframes pop { from { transform: scale(0.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
body.shake { animation: shake 0.4s; }
@keyframes shake { 20% { transform: translate(-6px, 2px); } 40% { transform: translate(6px, -2px); } 60% { transform: translate(-4px, 0); } 80% { transform: translate(4px, 1px); } }

/* ---- 다크 판타지 표면 ---- */
.anvil, .mine, .boss, .book-card, table.ready, .auto, .rebirth, .unlock, .cash li, .buy, .tile, .sheet {
  background: linear-gradient(180deg, #1c1712 0%, #120f0c 100%);
  border: 1px solid var(--line);
  box-shadow: inset 0 0 0 1px rgba(201, 162, 74, 0.12), inset 0 1px 0 rgba(255, 240, 210, 0.05), 0 6px 16px rgba(0, 0, 0, 0.45);
}
.anvil, .mine, .boss { border-color: #5a4630; }
.anvil::before, .anvil::after, .boss::before, .boss::after, .mine::before, .mine::after {
  content: ""; position: absolute; width: 14px; height: 14px; border: 2px solid var(--gold); pointer-events: none; opacity: 0.8;
}
.anvil::before, .boss::before, .mine::before { top: 4px; left: 4px; border-right: 0; border-bottom: 0; }
.anvil::after, .boss::after, .mine::after { bottom: 4px; right: 4px; border-left: 0; border-top: 0; }
.anvil-art, .boss-art, .mine-art { background: radial-gradient(circle at 50% 55%, #2b2118 0%, #0a0807 72%); border-radius: 50%; aspect-ratio: 1; display: grid; place-items: center; }
h2 { font-family: var(--font-head); font-weight: 800; letter-spacing: -0.01em; }
h2 .lv { color: var(--gold-hi); text-shadow: 0 0 12px rgba(241, 212, 136, 0.45); font-family: var(--font-display); font-weight: 400; }
h3.sec { font-family: var(--font-head); font-weight: 800; color: var(--gold); letter-spacing: 0.02em; border-bottom: 1px solid var(--line); padding-bottom: 4px; }
.grade-tag { letter-spacing: 0.12em; }
.mineral { color: var(--gold-hi); text-shadow: 0 0 10px rgba(241, 212, 136, 0.3); }
.enhance-btn {
  background: linear-gradient(180deg, #c33a24 0%, #8c1a12 55%, #5e0f0a 100%);
  color: var(--fg); border: 1px solid var(--gold); box-shadow: inset 0 1px 0 rgba(255, 220, 180, 0.35), inset 0 -3px 0 rgba(0, 0, 0, 0.35), 0 4px 0 #3a0906, 0 0 24px -6px #d8442c;
}
.enhance-btn:active { box-shadow: inset 0 1px 0 rgba(255, 220, 180, 0.2), 0 1px 0 #3a0906; }
.enhance-btn .eb-title { font-family: var(--font-display); font-weight: 400; font-size: 34px; text-shadow: 0 2px 0 rgba(0, 0, 0, 0.5), 0 0 14px rgba(255, 160, 90, 0.5); letter-spacing: 0.3em; padding-left: 0.3em; }
.enhance-btn .eb-meta { color: #f3dcc0; }
.enhance-btn.mint { background: linear-gradient(180deg, #2f6b62 0%, #1b4740 60%, #102c28 100%); color: var(--fg); box-shadow: inset 0 1px 0 rgba(200, 255, 240, 0.25), 0 4px 0 #0a1c19; }
.enhance-btn:disabled { background: linear-gradient(180deg, #2a231c, #1a1511); border-color: var(--line); color: var(--muted); box-shadow: none; }
.btn { background: linear-gradient(180deg, #2a221a, #1a1511); border-color: #4a3b2a; }
.btn.gold { background: linear-gradient(180deg, #4a3812, #2a1f0a); border-color: var(--gold); color: var(--gold-hi); }
.tabs { background: linear-gradient(180deg, #15110d, #0b0908); border-top: 1px solid #5a4630; }
.tabs button { font-family: var(--font-head); }
.tabs button[aria-current="page"] { color: var(--gold-hi); background: linear-gradient(180deg, #2a2016, #18130e); box-shadow: inset 0 -2px 0 var(--gold); }
.speed { border-color: #4a3b2a; }
.pity span { background: linear-gradient(90deg, #5a3a0e, var(--gold-hi)); }
.hint, .warn { background: #241b0c; border-color: #6a5220; color: var(--gold-hi); }
.banner-inner strong { font-family: var(--font-display); }
.banner-inner span { font-family: var(--font-head); font-weight: 800; }
.sheet h3 { font-family: var(--font-head); font-weight: 800; color: var(--gold-hi); }

/* ---- 연출 ---- */
#fx { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 24; }
.anvil.pillar .anvil-art { animation: pillar 0.9s ease-out; }
@keyframes pillar { 0% { box-shadow: 0 0 0 0 var(--grade), 0 -40px 80px 10px var(--grade); } 100% { box-shadow: 0 0 0 0 transparent; } }
body.crack::after { content: ""; position: fixed; inset: 0; z-index: 23; pointer-events: none; background:
  linear-gradient(115deg, transparent 49.6%, rgba(228, 103, 90, 0.55) 50%, transparent 50.4%),
  linear-gradient(60deg, transparent 49.7%, rgba(228, 103, 90, 0.4) 50%, transparent 50.3%),
  radial-gradient(circle at 50% 35%, rgba(158, 31, 23, 0.35), transparent 60%);
  animation: crack 0.7s ease-out forwards; }
@keyframes crack { from { opacity: 1; } to { opacity: 0; } }

/* ---- AI 그림 ---- */
img.art { display: block; max-width: 100%; height: auto; border-radius: 50%; }
.tile img.art, .buy img.art { border-radius: 4px; }
.aura-violet img.art, .aura-gold img.art { filter: drop-shadow(0 0 10px var(--glow)); }
img.logo { width: 100%; height: auto; margin-top: 8px; }
#splash { position: fixed; inset: 0; z-index: 40; background: radial-gradient(ellipse at 50% 40%, #2a160e 0%, #0b0807 70%); display: grid; place-items: center; padding: 24px max(16px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); cursor: pointer; }
.splash-inner { max-width: 440px; width: 100%; display: grid; gap: 18px; text-align: center; }
.splash-inner img { width: 100%; height: auto; animation: pop 0.8s ease-out; }
.splash-inner p { margin: 0; font-family: var(--font-head); font-weight: 800; color: var(--gold); letter-spacing: 0.04em; }
/* ---- 연계와 손맛 ---- */
.guide { display: flex; gap: 8px; align-items: center; text-align: left; width: 100%; background: linear-gradient(90deg, #2a1d10, #17120d); border: 1px solid #5a4630; border-radius: var(--r); padding: 7px 10px; font-size: 13px; color: var(--fg); cursor: pointer; }
.guide span { flex: none; font-family: var(--font-head); font-weight: 800; color: #1a0f05; background: var(--gold); border-radius: 3px; padding: 0 6px; font-size: 12px; }
.guide.g-boss { border-color: var(--ember-hi); animation: pulse 1.6s ease-in-out infinite; }
.guide.g-boss span { background: var(--ember-hi); color: #fff; }
@keyframes pulse { 50% { box-shadow: 0 0 16px -2px var(--ember-hi); } }
.tabs button { position: relative; transition: color 0.2s, background 0.2s; }
.tabs button.dot::after { content: ""; position: absolute; top: 6px; right: calc(50% - 22px); width: 8px; height: 8px; border-radius: 50%; background: var(--ember-hi); box-shadow: 0 0 8px var(--ember-hi); }
#view.enter { animation: viewIn 0.24s ease-out; }
@keyframes viewIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.anvil-art img.art { animation: artIn 0.28s ease-out; }
@keyframes artIn { from { transform: scale(0.92); filter: brightness(1.6) drop-shadow(0 0 14px var(--glow)); } to { transform: none; } }
.btn, .buy, .tile, .pack, .guide { transition: transform 0.08s ease-out, filter 0.15s; }
.btn:active, .buy:active, .tile:active, .pack:active, .guide:active { transform: scale(0.97); filter: brightness(1.15); }
.float { position: fixed; z-index: 26; pointer-events: none; transform: translate(-50%, 0); font-family: var(--font-display); font-size: 26px; white-space: nowrap; animation: floatUp 1s ease-out forwards; text-shadow: 0 2px 0 rgba(0,0,0,0.6), 0 0 12px currentColor; }
.float.good { color: var(--gold-hi); }
.float.gain { color: var(--gold-hi); font-family: var(--font-num); font-size: 18px; }
.float.miss { color: var(--muted); font-size: 22px; }
.float.bad { color: var(--no); font-size: 34px; }
@keyframes floatUp { 0% { opacity: 0; transform: translate(-50%, 6px) scale(0.8); } 15% { opacity: 1; transform: translate(-50%, -6px) scale(1.08); } 100% { opacity: 0; transform: translate(-50%, -56px) scale(1); } }
.banner-inner.evolve img { width: 180px; height: auto; filter: drop-shadow(0 0 22px var(--grade)); animation: evolve 0.9s ease-out; }
@keyframes evolve { 0% { transform: scale(0.4) rotate(-20deg); filter: brightness(3) drop-shadow(0 0 40px var(--grade)); opacity: 0; } 60% { transform: scale(1.08) rotate(3deg); opacity: 1; } 100% { transform: none; } }
.packs { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.pack { position: relative; display: grid; justify-items: center; gap: 4px; text-align: center; padding: 14px 8px 10px; cursor: pointer; background: linear-gradient(180deg, #241a10, #120d09); border: 1px solid #6a5220; border-radius: 6px; box-shadow: inset 0 0 0 1px rgba(241, 212, 136, 0.12), 0 6px 16px rgba(0,0,0,0.5); }
.pack:first-child { grid-column: 1 / -1; grid-template-columns: 72px 1fr; grid-template-areas: "img name" "img line" "img price"; justify-items: start; text-align: left; column-gap: 12px; border-color: var(--gold); }
.pack:first-child img { grid-area: img; align-self: center; }
.pack:first-child strong { grid-area: name; }
.pack:first-child small { grid-area: line; }
.pack:first-child .pack-price { grid-area: price; }
.pack img { width: 72px; height: 72px; }
.pack strong { font-family: var(--font-head); font-weight: 800; font-size: 14px; color: var(--gold-hi); }
.pack small { font-size: 11.5px; line-height: 1.35; }
.pack-price { font-family: var(--font-num); font-size: 14px; color: #1a0f05; background: linear-gradient(180deg, var(--gold-hi), var(--gold)); border-radius: 999px; padding: 3px 12px; margin-top: 4px; }
.pack-tag { position: absolute; top: -8px; left: 8px; font-style: normal; font-size: 10.5px; font-weight: 800; color: #fff; background: var(--ember-hi); border-radius: 3px; padding: 1px 6px; letter-spacing: 0.04em; }
#modal:not([hidden]) { animation: fadeIn 0.18s ease-out; }
#modal .sheet { animation: sheetUp 0.26s cubic-bezier(0.2, 0.8, 0.2, 1); }
@keyframes fadeIn { from { opacity: 0; } }
@keyframes sheetUp { from { transform: translateY(40px); opacity: 0; } }
#toast:not([hidden]) { animation: toastIn 0.22s ease-out; }
@keyframes toastIn { from { opacity: 0; transform: translate(-50%, 10px); } }

.dps-card { display: grid; gap: 8px; padding: 12px; background: linear-gradient(180deg, #1c1712, #120f0c); border: 1px solid var(--line); border-radius: var(--r); }
.dps-card h3.sec { margin: 0; }
.auto small { flex-basis: 100%; }
.tap-vein { position: relative; border: 0; padding: 0; cursor: pointer; color: inherit; }
.tap-vein.hit img { animation: veinHit 0.14s ease-out; }
@keyframes veinHit { 40% { transform: scale(0.93) rotate(-2deg); filter: brightness(1.5); } }
.tap-hint { position: absolute; left: 50%; bottom: -4px; transform: translateX(-50%); white-space: nowrap; font-size: 11px; font-weight: 800; color: #062320; background: var(--mineral); border-radius: 999px; padding: 1px 8px; box-shadow: 0 0 10px rgba(111, 214, 196, 0.5); }
/* ---- 광맥 둘러싸고 때리기 ---- */
.arena { display: grid; gap: 6px; padding: 8px 0 4px; background: radial-gradient(circle at 50% 50%, #13221f 0%, #0c0a09 62%); border: 1px solid #2c3b37; border-radius: var(--r); position: relative; overflow: hidden; }
.arena-ring { position: relative; width: min(330px, 100%); aspect-ratio: 1; margin: 0 auto; }
.arena-ring::before { content: ""; position: absolute; inset: 16%; border-radius: 50%; border: 1px dashed rgba(111, 214, 196, 0.18); }
.arena .tap-vein { position: absolute; left: 50%; top: 50%; width: 38%; transform: translate(-50%, -50%); background: none; z-index: 2; }
.arena .tap-vein img { width: 100%; height: auto; border-radius: 0; }
.arena.busy .tap-vein img { animation: quake 0.32s steps(2) infinite; }
@keyframes quake { 50% { transform: translate(1px, -1px) rotate(0.6deg); filter: brightness(1.15); } }
.arena .tap-vein.hit img { animation: veinHit 0.14s ease-out; }
.striker { position: absolute; left: 50%; top: 50%; width: 0; height: 0; transform: rotate(var(--a)); z-index: 1; }
.arm { position: absolute; left: -24px; top: -24px; width: 48px; height: 48px; --R: -128px; --H: -84px; transform: translateY(var(--R)); animation: lunge var(--dur) ease-in var(--delay) infinite; }
.r-mid .arm { --R: -108px; --H: -74px; }
.r-in .arm { --R: -90px; --H: -64px; }
.blade { display: block; width: 48px; height: 48px; transform: rotate(calc(-1 * var(--a))); }
.blade img.art { width: 48px; height: 48px; border-radius: 0; animation: swing var(--dur) ease-in var(--delay) infinite; filter: drop-shadow(0 0 4px rgba(0,0,0,0.9)); }
.arm::before { content: ""; position: absolute; left: -10px; right: -10px; bottom: -14px; height: 22px; border-radius: 50%; border-bottom: 3px solid rgba(230, 255, 250, 0.85); filter: blur(0.6px); opacity: 0; animation: slash var(--dur) linear var(--delay) infinite; }
.arm::after { content: ""; position: absolute; left: 50%; bottom: -6px; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; background: radial-gradient(circle, #fff 0%, #9ff5e6 35%, transparent 70%); opacity: 0; animation: spark var(--dur) linear var(--delay) infinite; }
.fight .arm::before { border-bottom-color: rgba(255, 210, 170, 0.9); }
.fight .arm::after { background: radial-gradient(circle, #fff 0%, #ff8a5a 35%, transparent 70%); }
@keyframes lunge { 0%, 100% { transform: translateY(var(--R)); } 40% { transform: translateY(calc(var(--R) - 8px)); } 58% { transform: translateY(var(--H)); } 70% { transform: translateY(calc(var(--H) - 6px)); } }
@keyframes swing { 0%, 100% { transform: rotate(-28deg); filter: drop-shadow(0 0 4px rgba(0,0,0,0.9)); } 40% { transform: rotate(-40deg); } 58% { transform: rotate(32deg); filter: drop-shadow(-10px 4px 0 rgba(220,255,250,0.35)) drop-shadow(-20px 8px 0 rgba(220,255,250,0.15)); } 72% { transform: rotate(18deg); } }
@keyframes slash { 0%, 52% { opacity: 0; transform: scaleX(0.3) rotate(-10deg); } 60% { opacity: 1; transform: scaleX(1.1) rotate(8deg); } 74%, 100% { opacity: 0; transform: scaleX(1.3) rotate(14deg); } }
@keyframes spark { 0%, 58% { opacity: 0; transform: scale(0.4); } 64% { opacity: 1; transform: scale(1.4); } 80%, 100% { opacity: 0; transform: scale(0.6); } }
.boss-center { position: absolute; left: 50%; top: 50%; width: 40%; transform: translate(-50%, -50%); z-index: 2; animation: quake 0.18s steps(2) infinite; }
.boss-center img.art { width: 100%; height: auto; }
.fight { background: radial-gradient(circle at 50% 50%, #2a0f0c 0%, #0c0a09 62%); border-color: #4a2018; }
.trait-head { display: flex; gap: 12px; align-items: center; }
.trait-head img.art { flex: none; }
.float.small { font-size: 14px; opacity: 0.85; }
@media (max-width: 380px) { .arm { --R: -112px; --H: -74px; } .r-mid .arm { --R: -96px; --H: -66px; } .r-in .arm { --R: -80px; --H: -58px; } }
.cap-line { margin: -2px 0 6px; font-size: 12px; color: var(--muted); }
.enhance-btn.promote { background: linear-gradient(180deg, #f1d488 0%, #c9a24a 55%, #7a5a1e 100%); color: #1a0f05; border-color: #fff3c0; box-shadow: inset 0 1px 0 rgba(255, 250, 220, 0.6), 0 4px 0 #4a3510, 0 0 26px -4px var(--gold-hi); }
.enhance-btn.promote .eb-meta { color: #2a1a05; }
.enhance-btn.promote .eb-title { font-size: 26px; letter-spacing: 0.08em; padding-left: 0.08em; }
.enhance-btn.promote:disabled { background: linear-gradient(180deg, #3a3020, #221c12); color: var(--muted); }
.enhance-btn.promote:disabled .eb-meta { color: var(--muted); }
/* ---- 쫀득한 앱 손맛 ---- */
:root { --spring: cubic-bezier(0.34, 1.56, 0.64, 1); --ease-out: cubic-bezier(0.2, 0.8, 0.2, 1); }
html { overscroll-behavior-y: none; }
body { -webkit-tap-highlight-color: transparent; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
#hud { background: rgba(12, 10, 9, 0.82); -webkit-backdrop-filter: blur(14px) saturate(1.3); backdrop-filter: blur(14px) saturate(1.3); }
.btn, .enhance-btn, .buy, .tile, .pack, .guide, .info-btn, .unlock, .speed, .tabs button { position: relative; overflow: hidden; transition: transform 0.38s var(--spring), filter 0.2s, box-shadow 0.2s; will-change: transform; }
.btn:active:not(:disabled), .buy:active:not(:disabled), .tile:active, .pack:active, .guide:active, .info-btn:active, .unlock:active, .speed:active { transform: scale(0.94); transition-duration: 0.07s; filter: brightness(1.2); }
.enhance-btn:active:not(:disabled), body.holding .enhance-btn:not(:disabled) { transform: translateY(3px) scale(0.975); transition-duration: 0.07s; }
body.holding .enhance-btn:not(:disabled) { box-shadow: inset 0 0 30px rgba(255, 190, 120, 0.35), 0 0 34px -2px #ff6a3a; }
.ripple { position: absolute; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%; background: rgba(255, 236, 200, 0.35); pointer-events: none; animation: ripple 0.55s var(--ease-out) forwards; }
@keyframes ripple { to { transform: scale(22); opacity: 0; } }
.mineral.bump { animation: bump 0.32s var(--spring); }
@keyframes bump { 40% { transform: scale(1.12); color: #fff6d8; } }
.mineral { display: inline-block; transform-origin: left center; }
#view.enter[data-dir="r"] { animation: inR 0.34s var(--ease-out); }
#view.enter[data-dir="l"] { animation: inL 0.34s var(--ease-out); }
@keyframes inR { from { opacity: 0; transform: translateX(24px); } }
@keyframes inL { from { opacity: 0; transform: translateX(-24px); } }
.tile.on { animation: sel 0.4s var(--spring); }
@keyframes sel { 0% { transform: scale(0.88); } }
.tile-g { font-size: 9.5px; line-height: 1; color: var(--grade); font-weight: 800; letter-spacing: 0.04em; margin-top: 2px; }
.tile-lv { line-height: 1.2; }
/* 탭: 아이콘 + 미끄러지는 금빛 받침 */
.tabs { padding-top: 4px; }
.tabs button { display: grid; justify-items: center; gap: 1px; padding: 6px 0 4px; font-size: 11.5px; background: none !important; box-shadow: none !important; z-index: 1; }
.tabs svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; transition: transform 0.4s var(--spring); }
.tabs button[aria-current="page"] svg { transform: translateY(-2px) scale(1.14); filter: drop-shadow(0 0 6px rgba(241, 212, 136, 0.55)); }
.tab-ind { position: absolute; top: 4px; bottom: calc(4px + env(safe-area-inset-bottom, 0px)); left: max(8px, env(safe-area-inset-left, 0px)); width: calc((100% - 2 * max(8px, env(safe-area-inset-left, 0px))) / 5); transform: translateX(calc(var(--i, 0) * 100%)); transition: transform 0.45s var(--spring); pointer-events: none; }
.tab-ind::before { content: ""; position: absolute; inset: 0 6px; border-radius: 12px; background: linear-gradient(180deg, #2e2317, #18130e); box-shadow: inset 0 0 0 1px rgba(201, 162, 74, 0.35), inset 0 -2px 0 var(--gold); }
.tabs button.dot::after { top: 4px; right: calc(50% - 18px); }
/* 아래에서 올라오는 시트 */
#modal { padding: 0; -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); }
.sheet { box-sizing: border-box; border-radius: 20px 20px 0 0; padding: 10px 16px calc(18px + env(safe-area-inset-bottom, 0px)); max-height: 86vh; border-bottom: 0; }
#modal .sheet { animation: sheetUp 0.42s var(--spring); }
@keyframes sheetUp { from { transform: translateY(100%); } }
.grab { justify-self: center; width: 40px; height: 4px; border-radius: 2px; background: #5a4630; margin-bottom: 2px; }
#toast { border-radius: 999px; padding: 9px 18px; background: rgba(28, 23, 18, 0.94); border-color: #6a5220; -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
#toast:not([hidden]) { animation: toastIn 0.4s var(--spring); }
@keyframes toastIn { from { opacity: 0; transform: translate(-50%, 18px) scale(0.9); } }
.banner-inner { animation: pop 0.5s var(--spring); }
.banner-inner em { font-style: normal; font-size: 12.5px; color: var(--gold-hi); margin-top: 4px; }
/* 강화 진행 막대: 칸마다 한 단계, 금색 칸이 특성 단계 */
.track { display: grid; grid-template-columns: repeat(var(--cap), 1fr); gap: 2px; margin: 0 0 4px; }
.track i { height: 6px; border-radius: 2px; background: #2a221a; box-shadow: inset 0 0 0 1px #3b3024; }
.track i.f { background: linear-gradient(180deg, var(--gold-hi), var(--gold)); box-shadow: 0 0 6px -1px var(--gold); }
.track i.t { box-shadow: inset 0 0 0 1px var(--gold-hi); }
.track i.n { animation: fill 0.5s var(--spring); }
@keyframes fill { from { transform: scaleY(2.2); filter: brightness(1.8); } }
/* 무기 구매 카드 + 설명 */
.buy-card { position: relative; display: grid; }
.buy-card.locked .buy { opacity: 0.6; filter: grayscale(0.5); }
.info-btn { position: absolute; top: 3px; right: 3px; width: 22px; height: 22px; border-radius: 50%; border: 1px solid #6a5220; background: #241a10; color: var(--gold-hi); font: 800 12px/1 var(--font-head); padding: 0; cursor: pointer; display: grid; place-items: center; }
.info-btn::before { content: ""; position: absolute; inset: -10px; }
.unlock { cursor: pointer; }
.unlock small.more { color: var(--gold); font-size: 11.5px; }
.sheet.info { gap: 12px; }
.info-hero { display: grid; grid-template-columns: 112px 1fr; gap: 14px; align-items: center; }
.info-hero img.art { filter: drop-shadow(0 0 16px rgba(201, 162, 74, 0.35)); animation: artIn 0.5s var(--spring); }
.info-hero .pitch { font-size: 14px; color: var(--fg); }
.stats.four { grid-template-columns: repeat(4, 1fr); background: #120f0c; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; margin: 0; }
.pc { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: 13.5px; }
.pc li { padding-left: 22px; position: relative; }
.pc li::before { position: absolute; left: 2px; font-weight: 800; }
.pc .pro::before { content: "✓"; color: var(--ok); }
.pc .con::before { content: "✕"; color: var(--no); }
.counters { font-size: 13px; color: var(--muted); }
.evo { display: flex; align-items: center; justify-content: center; gap: 6px; background: radial-gradient(ellipse at 50% 50%, #221a12, transparent 70%); padding: 6px 0; }
.evo figure { margin: 0; display: grid; justify-items: center; gap: 2px; }
.evo figcaption { font-size: 11px; color: var(--muted); }
.evo .arrow { color: var(--gold); font-size: 22px; }
.fresh { text-align: center; font-family: var(--font-display); font-size: 26px; color: var(--gold-hi); text-shadow: 0 0 16px var(--gold); animation: pop 0.5s var(--spring); }
.seg.g5 { grid-template-columns: repeat(5, 1fr); }
.book-card header .btn { margin-left: auto; padding: 6px 12px; }
.info-btn { overflow: visible; }
.pack-tag { top: 0; left: 0; border-radius: 6px 0 6px 0; }
/* ---- 두근두근 강화 ---- */
body.suspense #view > *:not(.anvil):not(.enhance-btn) { opacity: 0.18; transition: opacity 0.25s; }
body.suspense .anvil { box-shadow: 0 0 0 1px var(--ember-hi), 0 0 50px -6px var(--ember-hi); }
body.suspense #hud, body.suspense .tabs { opacity: 0.35; transition: opacity 0.25s; }
body.suspense .enhance-btn { pointer-events: none; animation: throb 0.3s ease-in-out infinite; }
@keyframes throb { 50% { box-shadow: 0 0 40px 0 #ff5a2a; } }
.anvil-art.knock img.art { animation: knock 0.26s ease-out; }
@keyframes knock { 30% { transform: translateY(6px) scale(0.95); filter: brightness(1.9) drop-shadow(0 0 18px #ffb060); } }
.float.shard { color: #b68cff; font-size: 28px; }
/* 심연 조각 */
.shard-bar { display: grid; gap: 8px; padding: 10px 12px; border: 1px solid #4a3360; border-radius: 10px; background: linear-gradient(180deg, #1b1424, #110d16); }
.shard-bar.risk { border-color: #7a4fb0; box-shadow: 0 0 18px -8px #9a55e8; }
.shard-bar p { margin: 0; display: flex; gap: 14px; font-size: 13.5px; }
.shard { color: #c9a6ff; } .ticket { color: var(--gold-hi); }
.shard-bar .switch { font-size: 13px; }
.shard-bar small { font-size: 11.5px; }
/* 출석·미션 */
.daily { display: grid; gap: 10px; padding: 12px; border: 1px solid #6a5220; border-radius: 10px; background: linear-gradient(180deg, #241a10, #120d09); }
.attend-grid { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.attend-grid li { display: grid; justify-items: center; padding: 6px 0; border-radius: 8px; border: 1px solid var(--line); background: #15100c; }
.attend-grid li b { font-family: var(--font-num); font-size: 16px; color: var(--gold-hi); line-height: 1.2; }
.attend-grid li small { font-size: 10px; }
.attend-grid li.big { border-color: var(--gold); }
.attend-grid li.got { opacity: 0.45; background: #0f0c09; }
.attend-grid li.got b::after { content: " ✓"; font-size: 11px; color: var(--ok); }
.attend-grid li.now { border-color: var(--gold-hi); box-shadow: 0 0 14px -3px var(--gold-hi); animation: sel 0.5s var(--spring); }
.missions { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.missions li { display: grid; grid-template-columns: 1fr 96px; gap: 10px; align-items: center; font-size: 13.5px; }
.missions li.claimed { opacity: 0.5; }
.missions li > small { text-align: center; }
.missions .btn { padding: 7px 4px; font-size: 12.5px; }
.missions .bar { display: block; height: 5px; border-radius: 3px; background: #2a221a; overflow: hidden; margin-top: 3px; }
.missions .bar em { display: block; height: 100%; background: linear-gradient(90deg, var(--gold), var(--gold-hi)); transition: width 0.5s var(--spring); }
.gold-t { color: var(--gold-hi); }
/* 자랑 카드 */
.brag img { display: block; width: 100%; height: auto; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); -webkit-user-select: auto; user-select: auto; -webkit-touch-callout: default; }
.row .btn { flex: 1 1 28%; }
/* 광맥 등급 */
.mine { grid-template-columns: 1fr; }
.vein-name { margin: 0; text-align: center; font-family: var(--font-head); font-weight: 800; color: var(--mineral); font-size: 15px; }
.vein-name small { font-family: var(--font-num); margin-left: 6px; }
.bounce-note { margin: 0; text-align: center; font-size: 12px; color: var(--muted); }
.striker.bounce .blade img.art { filter: grayscale(1) brightness(0.55); }
.striker.bounce .arm::before, .striker.bounce .arm::after { display: none; }
.striker.bounce .arm { animation-name: bounceArm; }
@keyframes bounceArm { 0%, 100% { transform: translateY(var(--R)); } 55% { transform: translateY(calc(var(--H) + 10px)); } 68% { transform: translateY(calc(var(--R) + 6px)); } }
.veins { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.vein { display: grid; grid-template-columns: 1fr auto 84px; gap: 10px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: linear-gradient(180deg, #161512, #0f0d0b); }
.vein > div { display: grid; min-width: 0; }
.vein b { font-family: var(--font-head); font-size: 14.5px; }
.vein small { font-size: 11.5px; }
.vein .zero { color: var(--no); }
.vein .inc { font-family: var(--font-num); font-size: 13px; color: var(--mineral); white-space: nowrap; }
.vein .btn { padding: 7px 4px; font-size: 12.5px; }
.vein .pill { text-align: center; }
