<title>화타의 약초 일기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Song+Myung&display=swap">
<style>
/* 레이아웃: 화면 전체가 게임 캔버스. 낮에는 위 정보띠 + 아래 조작판, 밤에는 한지 장부 같은 한의원 화면이 덮는다. */
:root {
  --night: #1c2135;
  --night-2: #283050;
  --hanji: #f1e8d4;
  --hanji-2: #e3d6b9;
  --ink: #2a2118;
  --muted: #74674f;
  --jade: #2f7f74;
  --jade-2: #3f9a8c;
  --seal: #b8432f;
  --gold: #e3b54a;
  --good: #4f8f4a;
  --line: rgba(42, 33, 24, 0.18);
  --glass: rgba(20, 22, 36, 0.62);
  --display: "Song Myung", "Nanum Myeongjo", serif;
  --body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--night);
  color: var(--hanji);
  font-family: var(--body);
  font-size: 15px;
  overflow: hidden;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
button:disabled { opacity: 0.4; cursor: default; }

#app { position: relative; height: 100%; overflow: hidden; }
#dayui { position: absolute; inset: 0; }
#game { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }

/* 위 정보띠 */
.hud {
  position: absolute; top: 0; left: 0; right: 0;
  display: flex; flex-direction: column; gap: 6px;
  padding-top: 8px; padding-bottom: 0;
  padding-left: max(12px, env(safe-area-inset-left, 0px));
  padding-right: max(12px, env(safe-area-inset-right, 0px));
  pointer-events: none;
}
.hudrow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.chip {
  display: inline-flex; align-items: center; gap: 5px;
  background: var(--glass); border-radius: 6px; padding: 4px 8px;
  font-size: 13px; white-space: nowrap; font-variant-numeric: tabular-nums;
}
.chip b { color: var(--gold); font-weight: 400; }
.day { font-family: var(--display); font-size: 17px; background: var(--seal); color: #fff4e2; }
.meter { display: flex; align-items: center; gap: 6px; flex: 1 1 140px; min-width: 120px; }
.bar { flex: 1; height: 8px; border-radius: 4px; background: rgba(0,0,0,0.45); overflow: hidden; }
.bar i { display: block; height: 100%; width: 100%; background: var(--gold); transition: width 0.2s linear; }
#sunFill.late { background: #e0714f; }
#staminaFill { background: #79c26a; }
.over { color: #ff9c8a !important; }
#minimap { width: min(360px, 60vw); height: 14px; border-radius: 3px; background: var(--glass); }
.hud button { pointer-events: auto; }
.chipbtn { border: 0; }

/* 아래 조작판 */
.controls {
  position: absolute; left: 0; right: 0; bottom: 0;
  display: flex; justify-content: space-between; align-items: flex-end; gap: 8px;
  padding-bottom: max(10px, env(safe-area-inset-bottom, 0px)); padding-top: 0;
  padding-left: max(12px, env(safe-area-inset-left, 0px));
  padding-right: max(12px, env(safe-area-inset-right, 0px));
  pointer-events: none;
}
.controls > * { pointer-events: auto; }
.pad { display: flex; gap: 8px; }
.pad button {
  width: 58px; height: 58px; border-radius: 50%;
  border: 2px solid rgba(241,232,212,0.5); background: var(--glass);
  font-size: 22px; touch-action: none;
}
.pad button.on { background: rgba(227,181,74,0.55); }
.tools { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.toolrow { display: flex; gap: 4px; background: var(--glass); border-radius: 10px; padding: 4px; }
.toolrow button {
  white-space: nowrap; border: 0; background: transparent; border-radius: 7px;
  padding: 8px 10px; font-size: 14px; min-width: 52px;
}
.toolrow button.on { background: var(--hanji); color: var(--ink); }
#homeBtn { background: var(--jade); border: 0; border-radius: 8px; padding: 8px 14px; font-family: var(--display); font-size: 16px; }

#toasts {
  position: absolute; left: 50%; top: 92px; transform: translateX(-50%);
  display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none;
  width: min(90vw, 420px); z-index: 30;
}
#night:not([hidden]) ~ #toasts { top: auto; bottom: max(16px, env(safe-area-inset-bottom, 0px)); }
.toast {
  background: rgba(28,33,53,0.9); color: var(--hanji); border-radius: 8px;
  padding: 7px 12px; font-size: 14px; text-align: center; transition: opacity 0.4s, transform 0.4s;
}
.toast.good { background: rgba(47,127,116,0.95); }
.toast.bad { background: rgba(184,67,47,0.95); }
.toast.out { opacity: 0; transform: translateY(-6px); }

/* 대화 창 */
#panel {
  position: absolute; inset: 0; z-index: 40;
  display: flex; align-items: flex-end; justify-content: center;
  background: rgba(10,12,20,0.45);
  padding-bottom: max(16px, env(safe-area-inset-bottom, 0px)); padding-top: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.sheet {
  width: min(560px, 100%); max-height: 88%; overflow: auto;
  background: var(--hanji); color: var(--ink);
  border-radius: 12px 12px 6px 6px; padding: 18px 18px 14px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.4);
  display: grid; grid-template-columns: auto 1fr; gap: 4px 14px;
  border-top: 6px solid var(--seal);
}
#panelPortrait { grid-row: span 2; width: 72px; image-rendering: pixelated; align-self: start; background: var(--hanji-2); border-radius: 8px; }
#panelPortrait[hidden] + div { grid-column: 1 / -1; }
.sheet h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 24px; text-wrap: balance; }
#panelBody { margin: 6px 0 0; white-space: pre-line; line-height: 1.6; font-size: 15px; min-width: 0; }
#panelChoices { grid-column: 1 / -1; display: flex; flex-direction: column; gap: 8px; margin-top: 12px; position: sticky; bottom: -14px; background: var(--hanji); padding-bottom: 6px; }
.choice {
  text-align: left; border: 1px solid var(--line); background: #fbf6ea; border-radius: 8px; padding: 11px 14px; font-size: 15px; color: var(--ink);
}
.choice.primary { background: var(--jade); color: #f6f1e4; border-color: transparent; }

/* 밤: 한의원 */
#night {
  position: absolute; inset: 0; z-index: 20; overflow-y: auto;
  background:
    radial-gradient(ellipse at 50% -10%, rgba(227,181,74,0.18), transparent 60%),
    var(--night);
  -webkit-user-select: text; user-select: text;
}
#nightBody {
  max-width: 980px; margin: 0 auto;
  padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 22px;
}
.eyebrow { margin: 0; letter-spacing: 0.12em; font-size: 12px; color: var(--gold); }
#nightBody h2 { margin: 2px 0 0; font-family: var(--display); font-weight: 400; font-size: 34px; color: var(--hanji); }
#nightBody h4 { margin: 0 0 6px; font-family: var(--display); font-weight: 400; font-size: 20px; color: var(--hanji); }
.muted { color: #b7ad98; margin: 0 0 10px; font-size: 14px; }
.nighthead { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.stats { display: flex; gap: 18px; margin: 0; }
.stats div { display: flex; flex-direction: column; }
.stats dt { font-size: 12px; color: #b7ad98; }
.stats dd { margin: 0; font-size: 20px; color: var(--gold); font-variant-numeric: tabular-nums; }
.meds { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.med {
  background: var(--hanji); color: var(--ink); border-radius: 8px; padding: 14px;
  display: flex; flex-direction: column; gap: 6px; min-width: 0;
  border: 2px solid transparent;
}
.med.menu { border-color: var(--jade-2); box-shadow: inset 0 0 0 1px var(--jade-2); }
.med.locked { opacity: 0.6; }
.med header { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.med h3 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 21px; }
.tag { font-size: 12px; padding: 2px 7px; border-radius: 10px; background: var(--hanji-2); color: var(--muted); white-space: nowrap; }
.tag.lv { background: var(--seal); color: #fff4e2; }
.med p { margin: 0; font-size: 14px; line-height: 1.5; }
.cures { color: var(--seal); }
.recipe { color: var(--muted); }
.doses b { font-size: 18px; font-variant-numeric: tabular-nums; }
.med .row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.med button, .shop button {
  border: 1px solid var(--line); background: #fbf6ea; color: var(--ink);
  border-radius: 6px; padding: 7px 10px; font-size: 13px;
}
.med button.on { background: var(--jade); color: #f6f1e4; border-color: transparent; }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px; }
.two > div { min-width: 0; }
.shop { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.shop li { display: flex; justify-content: space-between; align-items: center; gap: 10px; background: var(--night-2); border-radius: 8px; padding: 10px 12px; }
.shop li div { display: flex; flex-direction: column; min-width: 0; }
.shop span { font-size: 13px; color: #d8cfba; }
.shop small { font-size: 12px; color: var(--gold); }
.inv { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 6px; }
.inv li { background: var(--night-2); border-radius: 6px; padding: 7px 10px; display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
.inv b { color: var(--gold); font-weight: 400; font-variant-numeric: tabular-nums; }
.inv em { font-style: normal; font-size: 12px; color: #9fd28f; }
.go { display: flex; justify-content: center; }
.primary.big, .big {
  background: var(--seal); color: #fff4e2; border: 0; border-radius: 10px;
  padding: 14px 34px; font-family: var(--display); font-size: 20px;
}

/* 밤 영업 화면 */
.service { display: flex; flex-direction: column; gap: 14px; }
.svtop { display: flex; align-items: center; gap: 12px; }
.svtop span { white-space: nowrap; color: var(--gold); font-variant-numeric: tabular-nums; }
.room {
  background: linear-gradient(#3a2d22, #2b2119); border-radius: 10px; padding: 16px;
  display: flex; flex-direction: column; gap: 14px; min-height: 220px;
  border: 1px solid rgba(227,181,74,0.2);
}
.front { display: flex; gap: 14px; align-items: flex-end; min-height: 120px; }
.front .empty { margin: auto; color: #b7ad98; }
.por { width: 84px; image-rendering: pixelated; flex: none; }
.bubble { background: var(--hanji); color: var(--ink); border-radius: 12px 12px 12px 2px; padding: 12px 14px; min-width: 0; flex: 1; }
.bubble b { font-family: var(--display); font-weight: 400; font-size: 18px; }
.bubble p { margin: 4px 0 0; font-size: 16px; line-height: 1.5; }
.bubble small { display: block; margin-top: 6px; color: var(--seal); font-size: 13px; }
.line { list-style: none; margin: 0; padding: 0; display: flex; gap: 8px; }
.line li { width: 46px; display: flex; flex-direction: column; gap: 3px; align-items: center; }
.line canvas { width: 40px; image-rendering: pixelated; }
.line i { display: block; height: 4px; background: #79c26a; border-radius: 2px; align-self: flex-start; }
.brew { background: var(--hanji); color: var(--ink); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 10px; align-items: center; }
.brew p { margin: 0; text-align: center; }
.gauge { position: relative; display: flex; width: 100%; height: 26px; border-radius: 6px; overflow: hidden; }
.gauge span { display: block; height: 100%; }
.gauge .z1 { flex: 28; background: #d1846f; }
.gauge .z2 { flex: 14; background: #e4c56a; }
.gauge .z3 { flex: 16; background: #6fb56a; }
#needle { position: absolute; top: -3px; bottom: -3px; width: 4px; margin-left: -2px; background: var(--ink); left: 0; border-radius: 2px; }
.medbar { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.medbar button {
  display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left;
  background: var(--hanji); color: var(--ink); border: 0; border-radius: 8px; padding: 10px 12px;
}
.medbar b { font-family: var(--display); font-weight: 400; font-size: 18px; }
.medbar span { font-size: 13px; color: var(--seal); }
.medbar small { font-size: 12px; color: var(--muted); }
.medbar .ghost { background: var(--night-2); color: var(--hanji); }
.medbar .ghost span { color: #d8cfba; }
.summary { background: var(--hanji); color: var(--ink); border-radius: 12px; padding: 22px; display: flex; flex-direction: column; gap: 8px; max-width: 560px; width: 100%; margin: 6vh auto 0; border-top: 6px solid var(--seal); }
.summary h2 { color: var(--ink) !important; }
.summary p { margin: 0; line-height: 1.6; }
.summary hr { border: 0; border-top: 1px solid var(--line); width: 100%; margin: 4px 0; }
.summary .eyebrow { color: var(--seal); }

@media (max-width: 600px) {
  .controls { flex-wrap: wrap; row-gap: 8px; }
  .tools { order: -1; width: 100%; }
  .pad button { width: 52px; height: 52px; }
  .toolrow button { padding: 7px 7px; min-width: 44px; font-size: 13px; }
  .hud .chip { font-size: 12px; padding: 3px 6px; }
  #toasts { top: 112px; }
}
@media (max-height: 480px) {
  .sheet { max-height: 96%; padding: 12px 14px 10px; }
  #panelBody { font-size: 13.5px; line-height: 1.45; }
  .sheet h2 { font-size: 20px; }
  #panelPortrait { width: 52px; }
  .choice { padding: 8px 12px; }
}
@media (prefers-reduced-motion: reduce) { .toast, .bar i { transition: none; } }
</style>

<div id="app">
  <div id="dayui">
    <canvas id="game" aria-label="마을 뒷들 화면"></canvas>
    <div class="hud">
      <div class="hudrow">
        <span class="chip day" id="hudDay">1일째</span>
        <span class="chip" id="hudZone">한의원 앞마당</span>
        <div class="chip meter" title="남은 낮 시간"><span>해</span><div class="bar"><i id="sunFill"></i></div></div>
        <div class="chip meter" title="기력"><span>기력</span><div class="bar"><i id="staminaFill"></i></div><b id="hudStamina">100</b></div>
      </div>
      <div class="hudrow">
        <button class="chip chipbtn" id="bagBtn">바구니 <b id="hudWeight">0/20</b></button>
        <span class="chip">화살 <b id="hudArrows">20</b></span>
        <span class="chip">나무 <b id="hudWood">0</b></span>
        <span class="chip">엽전 <b id="hudMoney">50</b></span>
        <canvas id="minimap" width="360" height="14" aria-label="지도"></canvas>
      </div>
    </div>
    <div class="controls">
      <div class="pad">
        <button data-pad="left" aria-label="왼쪽">◀</button>
        <button data-pad="right" aria-label="오른쪽">▶</button>
      </div>
      <div class="tools">
        <button id="homeBtn" hidden>한의원 들어가기</button>
        <div class="toolrow" id="arrowType" hidden>
          <button data-arrow="normal" class="on">보통 화살</button>
          <button data-arrow="net">그물 화살</button>
        </div>
        <div class="toolrow">
          <button data-mode="hand" class="on">손</button>
          <button data-mode="bow">활</button>
          <button data-mode="ladder">사다리</button>
          <button data-mode="plank">다리</button>
        </div>
      </div>
      <div class="pad">
        <button data-pad="down" aria-label="아래">▼</button>
        <button data-pad="up" aria-label="점프">▲</button>
      </div>
    </div>
  </div>

  <div id="night" hidden><div id="nightBody"></div></div>

  <div id="toasts" aria-live="polite"></div>

  <div id="panel" hidden>
    <div class="sheet" role="dialog" aria-labelledby="panelTitle">
      <canvas id="panelPortrait"></canvas>
      <div><h2 id="panelTitle"></h2><p id="panelBody"></p></div>
      <div id="panelChoices"></div>
    </div>
  </div>
</div>

<script type="module" src="src/game.js"></script>
